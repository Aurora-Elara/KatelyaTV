name = "katelyatv"
compatibility_date = "2026-07-03"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "katelyatv-db"
database_id = "6cfb22ed-7700-418e-839d-212376a20193"

[vars]
USERNAME = "admin"
NEXT_PUBLIC_STORAGE_TYPE = "d1"
NEXT_PUBLIC_ENABLE_REGISTER = "true"
NEXT_PUBLIC_SITE_NAME = "KatelyaTV"
SITE_NAME = "KatelyaTV"
NODE_ENV = "production"

[env.production]
name = "katelyatv"

[[env.production.d1_databases]]
binding = "DB"
database_name = "katelyatv-db"
database_id = "6cfb22ed-7700-418e-839d-212376a20193"

[env.production.vars]
USERNAME = "admin"
NEXT_PUBLIC_STORAGE_TYPE = "d1"
NEXT_PUBLIC_ENABLE_REGISTER = "true"
NEXT_PUBLIC_SITE_NAME = "KatelyaTV"
SITE_NAME = "KatelyaTV"
NODE_ENV = "production"

